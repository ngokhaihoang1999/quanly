name: Sync Database (SQL Migrations)

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-sync.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: supabase/setup-cli@v1
        with:
          version: 1.187.10

      - name: Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          DB_URL="postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.smzoomekyvllsgppgvxw.supabase.co:5432/postgres"
          supabase db push --db-url "$DB_URL" || (
            supabase link --project-ref smzoomekyvllsgppgvxw --password "$SUPABASE_DB_PASSWORD" &&
            supabase db push --include-all
          )

